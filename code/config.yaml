# vLLM Server Configuration
# ===========================

# Model settings
model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  dtype: "auto"
  max_model_len: 2048
  trust_remote_code: false

# Server settings
server:
  host: "0.0.0.0"
  port: 8000

# GPU settings
gpu:
  memory_utilization: 0.25
  tensor_parallel_size: 1

# Generation defaults
generation:
  max_tokens: 256
  temperature: 0.7
  top_p: 0.9

# Performance settings
performance:
  enforce_eager: true  # Disable CUDA graphs
  enable_prefix_caching: false
  disable_log_requests: false

# LoRA settings
lora:
  enable: true
  adapter_name: "lora"  # Name to reference this adapter in API calls
  adapter_path: "moo3030/Llama-3.2-1B-QLoRA-Summarizer-adapters"
  max_loras: 1
  max_lora_rank: 64

# Quantization (optional)
quantization:
  method: null  # Options: null, awq, gptq, fp8
