# vLLM Server Configuration
# ===========================

# Model settings
model:
  name: "meta-llama/Llama-3.2-1B-Instruct"
  dtype: "float16"  # Options: float16, bfloat16, auto
  max_model_len: 4096
  trust_remote_code: false

# Server settings
server:
  host: "0.0.0.0"
  port: 8000

# GPU settings
gpu:
  memory_utilization: 0.9  # Fraction of GPU memory to use (0.0 - 1.0)
  tensor_parallel_size: 1  # Number of GPUs for tensor parallelism

# Generation defaults
generation:
  max_tokens: 256
  temperature: 0.7
  top_p: 0.9

# Performance settings
performance:
  enforce_eager: false  # Set true to disable CUDA graphs (useful for debugging)
  enable_prefix_caching: true
  disable_log_requests: false

# LoRA settings (optional)
lora:
  enable: true
  adapter_path: ""  # Path to LoRA adapter
  max_loras: 1
  max_lora_rank: 64

# Quantization (optional)
quantization:
  method: null  # Options: null, awq, gptq, fp8

